# Change "app" to the name you pick with `fly launch --copy-config` (any unused name).
app = "zombie-pile"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # matchmaking lives in memory: keep one machine running
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/stats"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
